---
name: Discord GitHub 알림
'on':
  issues:
    types:
    - opened
  pull_request:
    types:
    - opened
  workflow_run:
    workflows:
    - Sync shared labels
    - PR 담당자 자동 지정
    - Issue 담당자 자동 지정
    types:
    - completed
permissions:
  contents: read
jobs:
  notify:
    uses: hadevyi/.github/.github/workflows/reusable-discord-notify.yml@4678ec5ffadaeda894ce67f580b76af898c8d729
    with:
      bot-name: Study Bot
    secrets:
      DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"
